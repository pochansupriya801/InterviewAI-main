{% extends "base.html" %}
{% block title %}Login - InterviewAI{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span>🤖</span> InterviewAI</div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to continue your interview practice.</p>
    <form id="loginForm" class="auth-form">
      <label>Email<input type="email" id="loginEmail" required placeholder="you@example.com" /></label>
      <label>Password<input type="password" id="loginPassword" required placeholder="••••••" /></label>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div id="loginMessage" class="form-message"></div>
    <p class="auth-switch">No account? <a href="{{ url_for('register_page') }}">Create one</a></p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('loginMessage');
  msg.textContent = 'Logging in...';
  msg.className = 'form-message';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    msg.textContent = 'Success! Redirecting...';
    msg.classList.add('success');
    window.location.href = '/dashboard';
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add('error');
  }
});
</script>
{% endblock %}
